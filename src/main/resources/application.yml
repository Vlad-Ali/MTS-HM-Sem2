spring:
  application:
    name: cassandrahomework
  datasource:
    url: jdbc:postgresql://localhost:5432/articles_app
    username: postgres_user
    password: 123
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      dialect: org.hibernate.dialect.PostgresSQLDialect
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
logging:
  level:
    com.example.cassandrahomework.service: DEBUG
    com.example.cassandrahomework.repository: DEBUG
    com.example.cassandrahomework.cassandra: DEBUG
    org.flywaydb: DEBUG